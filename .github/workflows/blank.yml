name: Build VisionClaw Debug APK

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          cd samples/CameraAccessAndroid
          echo \"github_token=${{ secrets.GITHUB_TOKEN }}\" >> local.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cd samples/CameraAccessAndroid
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: visionclaw-debug-apk
          path: samples/CameraAccessAndroid/app/build/outputs/apk/debug/app-debug.apk
